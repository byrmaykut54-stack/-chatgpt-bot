name: NEXORA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: mexay_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/mexay_test
      RUN_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium --only-shell
      - name: Compile Python
        run: python -m py_compile business_assistant.py database.py google_calendar.py reminder_worker.py cron_reminders.py
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path(".").glob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
              print("OK", p)
          PY
      - name: Validate frontend JavaScript and referenced IDs
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",html,re.S|re.I)
          for i,script in enumerate(scripts):
              Path(f"/tmp/nexora-{i}.js").write_text(script,encoding="utf-8")
          ids=set(re.findall(r'\bid=["\']([^"\']+)["\']',html))
          refs=set(re.findall(r'getElementById\(["\']([^"\']+)["\']\)',html))
          missing=sorted(x for x in refs if x not in ids)
          if missing:
              raise SystemExit("Missing DOM IDs: "+", ".join(missing))
          print(f"Validated {len(scripts)} inline script block(s), {len(ids)} IDs")
          PY
          for f in /tmp/nexora-*.js; do node --check "$f"; done

